# action.yml

name: 'Auto PR: dev to main/master'
description: 'Automates PR creation from dev to main/master, generates descriptions with OpenAI, and adds reviewers.'
author: 'Yuri V'
branding:
  icon: 'git-pull-request'
  color: 'green'
inputs:
  openai_api_key:
    description: 'OpenAI API Key'
    required: true
  openai_model:
    description: 'OpenAI model to use (e.g., gpt-5.4-mini, gpt-5.4, etc.) https://developers.openai.com/api/docs/guides/latest-model'
    required: false
    default: 'gpt-5.4-mini'
  github_token:
    description: 'GitHub (PAT) token with repo permissions'
    required: true
  dev_branch:
    description: 'Development branch name'
    required: false
    default: 'dev'
outputs:
  pr_number:
    description: 'The number of the pull request created or updated'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.dev_branch }}
        fetch-depth: 0

    - name: Set up Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get the default branch
      id: get_default_branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        default_branch=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
        echo "branch=${default_branch}" >> "$GITHUB_OUTPUT"

    - name: Get the diff
      id: get_diff
      shell: bash
      env:
        DEV_BRANCH: ${{ inputs.dev_branch }}
        DEFAULT_BRANCH: ${{ steps.get_default_branch.outputs.branch }}
      run: |
        set -e
        echo "Branch from: $DEFAULT_BRANCH"
        echo "Branch to: $DEV_BRANCH"

        git fetch --all

        diff_output=$(cat <<DIFF_CONTENT
        Commits between $DEFAULT_BRANCH and $DEV_BRANCH:
        ============================================
        $(git log "origin/${DEFAULT_BRANCH}..origin/${DEV_BRANCH}" -- 2>/dev/null || echo "No commits found")
        --------------------------------------------
        Git diff between $DEFAULT_BRANCH and $DEV_BRANCH
        ============================================
        $(git diff "origin/${DEFAULT_BRANCH}" "origin/${DEV_BRANCH}" 2>/dev/null || echo "No differences found")
        DIFF_CONTENT
        )

        if [ -n "$diff_output" ]; then
          {
            echo "diff_output<<GITHUB_OUTPUT_EOF"
            echo "$diff_output"
            echo "GITHUB_OUTPUT_EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "diff_output=No changes detected between $DEFAULT_BRANCH and $DEV_BRANCH" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate release description using OpenAI API
      id: generate_release_notes
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        OPENAI_MODEL: ${{ inputs.openai_model }}
        DIFF_OUTPUT: ${{ steps.get_diff.outputs.diff_output }}
      shell: bash
      run: |
        prompt="**Instructions:**\n\nPlease generate a **Pull Request description** for the provided diff, following these guidelines:\n- Add appropriate emojis to the description.\n- Do **not** include the words \"Title\" and \"Description\" in your output.\n- Format your answer in **Markdown**."

        escaped_prompt=$(echo "$prompt" | jq -Rs .)
        escaped_diff=$(echo "$DIFF_OUTPUT" | jq -Rs .)

        response=$(curl -sS --fail-with-body -X POST https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -d "{
            \"model\": \"${OPENAI_MODEL}\",
            \"messages\": [
              {
                \"role\": \"system\",
                \"content\": ${escaped_prompt}
              },
              {
                \"role\": \"user\",
                \"content\": ${escaped_diff}
              }
            ],
            \"temperature\": 0.7,
            \"max_completion_tokens\": 2048
          }") || {
          echo "::error::OpenAI API request failed"
          exit 1
        }

        # Check for errors in the response
        error_message=$(echo "$response" | jq -r '.error.message // empty')
        if [ -n "$error_message" ]; then
          echo "::error::OpenAI API error: $error_message"
          exit 1
        fi

        description=$(echo "$response" | jq -r '.choices[0].message.content')
        if [ -z "$description" ] || [ "$description" = "null" ]; then
          echo "::error::OpenAI returned empty response"
          exit 1
        fi

        {
          echo "description<<GITHUB_OUTPUT_EOF"
          echo "$description"
          echo "GITHUB_OUTPUT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set Release Title
      id: set_release_title
      shell: bash
      run: |
        echo "title=Release v$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

    - name: Create or Update Pull Request and Add Reviewers
      id: create_pr
      uses: actions/github-script@v7
      env:
        PR_TITLE: ${{ steps.set_release_title.outputs.title }}
        PR_BODY: ${{ toJSON(steps.generate_release_notes.outputs.description) }}
        DEV_BRANCH: ${{ inputs.dev_branch }}
        DEFAULT_BRANCH: ${{ steps.get_default_branch.outputs.branch }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const head = process.env.DEV_BRANCH;
          const base = process.env.DEFAULT_BRANCH;
          const title = process.env.PR_TITLE;
          const body = JSON.parse(process.env.PR_BODY);

          // Check if there are any commits between base and head
          const { data: comparison } = await github.rest.repos.compareCommits({
            owner,
            repo,
            base,
            head,
          });

          if (comparison.commits.length === 0) {
            core.info('No commits between ' + base + ' and ' + head + '. Skipping PR creation.');
            core.setOutput('pr_number', 'none');
            return;
          }

          // Check if PR from dev to default branch already exists
          const { data: pulls } = await github.rest.pulls.list({
            owner,
            repo,
            head: `${owner}:${head}`,
            base,
            state: 'open',
          });

          let prNumber;
          let prAuthor;
          if (pulls.length > 0) {
            prNumber = pulls[0].number;
            prAuthor = pulls[0].user.login;
            core.info(`Updating existing PR #${prNumber}`);
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              title,
              body,
            });
          } else {
            core.info('Creating new PR');
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body,
            });
            prNumber = pr.number;
            prAuthor = pr.user.login;
          }

          // Add reviewers from commit authors
          const { data: commits } = await github.rest.pulls.listCommits({
            owner,
            repo,
            pull_number: prNumber,
          });

          const committersSet = new Set();
          for (const commit of commits) {
            if (commit.author && commit.author.login) {
              committersSet.add(commit.author.login);
            }
          }

          committersSet.add(owner);
          committersSet.delete(prAuthor);
          committersSet.delete('github-actions[bot]');

          const reviewers = Array.from(committersSet);

          if (reviewers.length > 0) {
            core.info(`Adding reviewers: ${reviewers.join(', ')}`);
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers,
              });
            } catch (error) {
              core.warning(`Failed to add some reviewers: ${error.message}`);
            }
          } else {
            core.info('No reviewers to add.');
          }

          core.setOutput('pr_number', prNumber);
