# action.yml

name: 'Auto PR: dev to main/master'
description: 'Automates PR creation from dev to main/master, generates descriptions with OpenAI, and adds reviewers.'
author: 'Yuri V'
branding:
  icon: 'git-pull-request'
  color: 'green'
inputs:
  openai_api_key:
    description: 'OpenAI API Key'
    required: true
  openai_model:
    description: 'OpenAI model to use (e.g., gpt-5.4-mini, gpt-5.4, etc.) https://developers.openai.com/api/docs/guides/latest-model'
    required: false
    default: 'gpt-5.4-mini'
  github_token:
    description: 'GitHub (PAT) token with repo permissions'
    required: true
  dev_branch:
    description: 'Development branch name'
    required: false
    default: 'dev'
  max_diff_bytes:
    description: 'Max size (bytes) of the diff payload sent to the model. Kept well inside the context window so large releases do not 400 with context_length_exceeded.'
    required: false
    default: '200000'
outputs:
  pr_number:
    description: 'The number of the pull request created or updated'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.dev_branch }}
        fetch-depth: 0

    - name: Set up Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get the default branch
      id: get_default_branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        default_branch=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
        echo "branch=${default_branch}" >> "$GITHUB_OUTPUT"

    - name: Get the diff
      id: get_diff
      shell: bash
      env:
        DEV_BRANCH: ${{ inputs.dev_branch }}
        DEFAULT_BRANCH: ${{ steps.get_default_branch.outputs.branch }}
        MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
      run: |
        set -e
        echo "Branch from: $DEFAULT_BRANCH"
        echo "Branch to: $DEV_BRANCH"

        git fetch --all

        # Write the payload to a file rather than a step output / env var. A
        # large diff (hundreds of KB) exceeds the per-string execve limit
        # (MAX_ARG_STRLEN, 128KB on Linux) when exported as an env var, which
        # makes the next step fail to start with "Argument list too long".
        #
        # The raw line-diff of a big release (hundreds of commits) is both huge
        # and low-signal for a summary, and a full diff easily overflows the
        # model's context window -> the API rejects it with HTTP 400
        # context_length_exceeded. So lead with the compact, high-signal parts
        # (commit log + per-file diffstat) and append the unified diff, then cap
        # the whole thing to MAX_DIFF_BYTES.
        diff_file="${RUNNER_TEMP}/auto_pr_diff.txt"
        {
          echo "Commits between $DEFAULT_BRANCH and $DEV_BRANCH:"
          echo "============================================"
          git log --pretty=format:'- %s (%h)' "origin/${DEFAULT_BRANCH}..origin/${DEV_BRANCH}" -- 2>/dev/null || echo "No commits found"
          echo
          echo "--------------------------------------------"
          echo "Changed files (diffstat):"
          echo "============================================"
          git diff --stat "origin/${DEFAULT_BRANCH}" "origin/${DEV_BRANCH}" -- . ':(exclude)*.pem' 2>/dev/null || echo "No diffstat"
          echo
          echo "--------------------------------------------"
          echo "Git diff between $DEFAULT_BRANCH and $DEV_BRANCH (may be truncated):"
          echo "============================================"
          git diff "origin/${DEFAULT_BRANCH}" "origin/${DEV_BRANCH}" -- . ':(exclude)*.pem' 2>/dev/null || echo "No differences found"
        } > "${diff_file}.full"

        if [ ! -s "${diff_file}.full" ]; then
          printf 'No changes detected between %s and %s\n' "$DEFAULT_BRANCH" "$DEV_BRANCH" > "${diff_file}.full"
        fi

        # Cap the payload well inside the model's context window. Truncate on a
        # byte boundary, then drop any dangling partial UTF-8 sequence with
        # `iconv -c`: a multibyte char (Cyrillic, em-dash, arrows...) split
        # mid-sequence yields invalid UTF-8, which the API also rejects with 400.
        max_bytes="${MAX_DIFF_BYTES:-200000}"
        if [ "$(wc -c < "${diff_file}.full")" -gt "$max_bytes" ]; then
          head -c "$max_bytes" "${diff_file}.full" | iconv -f UTF-8 -t UTF-8 -c > "$diff_file"
          printf '\n\n[diff truncated to ~%s bytes for the PR description]\n' "$max_bytes" >> "$diff_file"
        else
          mv "${diff_file}.full" "$diff_file"
        fi
        rm -f "${diff_file}.full"

        echo "diff_file=${diff_file}" >> "$GITHUB_OUTPUT"

    - name: Generate release description using OpenAI API
      id: generate_release_notes
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        OPENAI_MODEL: ${{ inputs.openai_model }}
        DIFF_FILE: ${{ steps.get_diff.outputs.diff_file }}
      shell: bash
      run: |
        set -e
        prompt="**Instructions:**\n\nPlease generate a **Pull Request description** for the provided diff, following these guidelines:\n- Add appropriate emojis to the description.\n- Do **not** include the words \"Title\" and \"Description\" in your output.\n- Format your answer in **Markdown**."

        # Build the request body with jq, streaming the diff from a file via
        # --rawfile. This keeps the (potentially large) diff off the command
        # line and out of the environment entirely.
        body_file="${RUNNER_TEMP}/openai_request.json"
        jq -n \
          --arg model "$OPENAI_MODEL" \
          --arg prompt "$prompt" \
          --rawfile diff "$DIFF_FILE" \
          '{
            model: $model,
            messages: [
              { role: "system", content: $prompt },
              { role: "user", content: $diff }
            ],
            max_completion_tokens: 2048
          }' > "$body_file"

        # Capture the body AND the HTTP status separately (no --fail-with-body):
        # on a 4xx we want to log the API's actual error message instead of just
        # "request failed", so problems like context_length_exceeded are visible.
        resp_file="${RUNNER_TEMP}/openai_response.json"
        http_code=$(curl -sS -o "$resp_file" -w '%{http_code}' -X POST https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -d @"$body_file") || {
          echo "::error::OpenAI API request failed (curl transport error)"
          exit 1
        }

        if [ "$http_code" -ge 400 ]; then
          echo "::error::OpenAI API returned HTTP ${http_code}: $(jq -r '.error.message // .' "$resp_file" 2>/dev/null | head -c 800)"
          exit 1
        fi

        # Defensive: surface an error object even on a 2xx (shouldn't happen).
        error_message=$(jq -r '.error.message // empty' "$resp_file")
        if [ -n "$error_message" ]; then
          echo "::error::OpenAI API error: $error_message"
          exit 1
        fi

        description=$(jq -r '.choices[0].message.content' "$resp_file")
        if [ -z "$description" ] || [ "$description" = "null" ]; then
          echo "::error::OpenAI returned empty response"
          exit 1
        fi

        {
          echo "description<<GITHUB_OUTPUT_EOF"
          echo "$description"
          echo "GITHUB_OUTPUT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set Release Title
      id: set_release_title
      shell: bash
      run: |
        echo "title=Release v$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

    - name: Create or Update Pull Request and Add Reviewers
      id: create_pr
      uses: actions/github-script@v7
      env:
        PR_TITLE: ${{ steps.set_release_title.outputs.title }}
        PR_BODY: ${{ toJSON(steps.generate_release_notes.outputs.description) }}
        DEV_BRANCH: ${{ inputs.dev_branch }}
        DEFAULT_BRANCH: ${{ steps.get_default_branch.outputs.branch }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const head = process.env.DEV_BRANCH;
          const base = process.env.DEFAULT_BRANCH;
          const title = process.env.PR_TITLE;
          const body = JSON.parse(process.env.PR_BODY);

          // Check if there are any commits between base and head
          const { data: comparison } = await github.rest.repos.compareCommits({
            owner,
            repo,
            base,
            head,
          });

          if (comparison.commits.length === 0) {
            core.info('No commits between ' + base + ' and ' + head + '. Skipping PR creation.');
            core.setOutput('pr_number', 'none');
            return;
          }

          // Check if PR from dev to default branch already exists
          const { data: pulls } = await github.rest.pulls.list({
            owner,
            repo,
            head: `${owner}:${head}`,
            base,
            state: 'open',
          });

          let prNumber;
          let prAuthor;
          if (pulls.length > 0) {
            prNumber = pulls[0].number;
            prAuthor = pulls[0].user.login;
            core.info(`Updating existing PR #${prNumber}`);
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              title,
              body,
            });
          } else {
            core.info('Creating new PR');
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body,
            });
            prNumber = pr.number;
            prAuthor = pr.user.login;
          }

          // Add reviewers from commit authors
          const { data: commits } = await github.rest.pulls.listCommits({
            owner,
            repo,
            pull_number: prNumber,
          });

          const committersSet = new Set();
          for (const commit of commits) {
            if (commit.author && commit.author.login) {
              committersSet.add(commit.author.login);
            }
          }

          committersSet.add(owner);
          committersSet.delete(prAuthor);
          committersSet.delete('github-actions[bot]');

          const reviewers = Array.from(committersSet);

          if (reviewers.length > 0) {
            core.info(`Adding reviewers: ${reviewers.join(', ')}`);
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers,
              });
            } catch (error) {
              core.warning(`Failed to add some reviewers: ${error.message}`);
            }
          } else {
            core.info('No reviewers to add.');
          }

          core.setOutput('pr_number', prNumber);
